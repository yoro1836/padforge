name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for example, 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="${REQUESTED_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Verify generated WebUI
        run: git diff --exit-code -- module/webroot

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target
          cache-on-failure: true

      - name: Validate module scripts
        run: sh -n module/keyforge.sh module/service.sh module/customize.sh module/uninstall.sh

      - name: Test daemon
        working-directory: daemon
        run: cargo test --locked

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Lint and build Android daemon
        working-directory: daemon
        run: |
          NDK=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$NDK/aarch64-linux-android21-clang
          export AR_aarch64_linux_android=$NDK/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android21-clang
          cargo clippy --locked --release --target aarch64-linux-android -- -D warnings
          cargo build --locked --release --target aarch64-linux-android

      - name: Package module
        id: package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          rm -rf pkg
          mkdir -p pkg
          cp -a module/. pkg/
          cp daemon/target/aarch64-linux-android/release/keyforge pkg/
          sed -i "s/^version=.*/version=v${VERSION}/" pkg/module.prop
          sed -i "s/^versionCode=.*/versionCode=$(date -u +%s)/" pkg/module.prop
          chmod 755 pkg/keyforge pkg/keyforge.sh pkg/service.sh pkg/customize.sh pkg/uninstall.sh
          test -f pkg/webroot/index.html
          test -f pkg/skip_mount
          ZIP="keyforge-v${VERSION}.zip"
          (cd pkg && zip -r "../${ZIP}" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyforge-v${{ steps.version.outputs.value }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
